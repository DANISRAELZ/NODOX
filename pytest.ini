[pytest]
testpaths = tests
pythonpath = .
addopts = -q
markers =
    unit: fast deterministic tests for local functions and small dataframes
    integration: tests that run multiple pipeline stages or touch workspace outputs
    slow: tests that are valid locally but slower than the normal development loop
    online: tests that require internet access or external APIs
    e2e: end-to-end CLI or full pipeline tests
