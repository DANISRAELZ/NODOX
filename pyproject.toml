[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nodos-funcionales"
version = "0.1.0"
description = "Pipeline reproducible para priorizacion computacional exploratoria de nodos funcionales bacterianos."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pandas>=2.0.0",
    "Pillow>=10.0.0",
    "pytest>=8.0.0",
]

[project.optional-dependencies]
# Optional workflow execution dependencies. These require separate
# transitive license/security review before public workflow distribution.
workflow = [
    "snakemake>=7.32.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
