[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nodos-funcionales"
version = "0.1.0"
description = "NODOX: explainable, multi-organism prioritization of bacterial therapeutic targets."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pandas>=2.0.0",
    "Pillow>=10.0.0",
    "certifi>=2024.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
]
# Optional workflow execution dependencies. These require separate
# transitive license and security review before public workflow distribution.
workflow = [
    "snakemake>=7.32.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
markers = [
    "unit: fast isolated tests",
    "integration: tests spanning multiple NODOX components",
    "online: tests of online-provider behavior, usually mocked or availability-dependent",
    "slow: tests that may take substantially longer than unit tests",
    "snapshot: deterministic output comparison tests",
    "e2e: end-to-end pipeline tests",
    "organism_regression: optional historical regression tied to a specific organism or former demonstration dataset",
]
