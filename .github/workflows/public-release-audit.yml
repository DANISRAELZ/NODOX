name: Public release audit

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install development dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt
      - name: Scan current tree and Git history
        shell: bash
        run: |
          python - <<'PY' | tee secret_scan_report.txt
          from __future__ import annotations
          import re, subprocess, sys
          from pathlib import Path

          patterns = {
              "AWS access key": re.compile(r"\bAKIA[0-9A-Z]{16}\b"),
              "GitHub classic token": re.compile(r"\bgh[pousr]_[A-Za-z0-9]{30,}\b"),
              "GitHub fine-grained token": re.compile(r"\bgithub_pat_[A-Za-z0-9_]{40,}\b"),
              "OpenAI-style key": re.compile(r"\bsk-[A-Za-z0-9_-]{20,}\b"),
              "Private key header": re.compile(r"-----BEGIN (?:RSA |EC |OPENSSH )?PRIVATE KEY-----"),
          }

          def decode(data: bytes):
              if b"\x00" in data:
                  return None
              try:
                  return data.decode("utf-8")
              except UnicodeDecodeError:
                  return None

          findings = []
          for raw in subprocess.check_output(["git", "ls-files", "-z"]).split(b"\0"):
              if not raw:
                  continue
              path = raw.decode("utf-8", errors="replace")
              text = decode(Path(path).read_bytes())
              if text is None:
                  continue
              for name, pattern in patterns.items():
                  if pattern.search(text):
                      findings.append(f"current:{path}: {name}")

          seen = set()
          for line in subprocess.check_output(["git", "rev-list", "--objects", "--all"], text=True).splitlines():
              parts = line.split(" ", 1)
              sha = parts[0]
              path = parts[1] if len(parts) == 2 else "<unknown>"
              if sha in seen:
                  continue
              seen.add(sha)
              try:
                  kind = subprocess.check_output(["git", "cat-file", "-t", sha], text=True, stderr=subprocess.DEVNULL).strip()
              except subprocess.CalledProcessError:
                  continue
              if kind != "blob":
                  continue
              if int(subprocess.check_output(["git", "cat-file", "-s", sha], text=True)) > 5_000_000:
                  continue
              text = decode(subprocess.check_output(["git", "cat-file", "blob", sha]))
              if text is None:
                  continue
              for name, pattern in patterns.items():
                  if pattern.search(text):
                      findings.append(f"history:{sha}:{path}: {name}")

          print("=== High-confidence secret findings ===")
          print("\n".join(sorted(set(findings))) if findings else "None detected")
          if findings:
              sys.exit(1)
          PY
      - name: Run portable offline test suite
        run: |
          python -m pytest -p no:cacheprovider -m "not online and not organism_regression" -q \
            2>&1 | tee pytest_offline_report.txt
      - name: Upload audit reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: public-release-audit-reports
          path: |
            secret_scan_report.txt
            pytest_offline_report.txt
          if-no-files-found: warn

  standard-suite:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install development dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt
      - name: Run organism-agnostic offline suite
        run: |
          python -m pytest -p no:cacheprovider -m "not online and not organism_regression" -q \
            2>&1 | tee pytest_standard_report.txt
      - name: Upload standard-suite report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: organism-agnostic-pytest-report
          path: pytest_standard_report.txt
          if-no-files-found: error

  online-provider-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install development dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt
      - name: Run online tests individually with hard limits
        id: online_contracts
        shell: bash
        run: |
          set -u
          : > pytest_online_provider_report.txt
          : > pytest_live_provider_diagnostics.txt
          contract_failures=0
          diagnostic_events=0

          mapfile -t nodeids < <(
            python -m pytest -p no:cacheprovider --collect-only -q \
              -m "online and not organism_regression" 2>/dev/null | grep '::' || true
          )

          echo "Collected ${#nodeids[@]} online tests" | tee -a pytest_online_provider_report.txt
          if [ ${#nodeids[@]} -eq 0 ]; then
            echo "No online tests were collected." | tee -a pytest_online_provider_report.txt
            exit 1
          fi

          for nodeid in "${nodeids[@]}"; do
            normalized="$(printf '%s' "$nodeid" | tr '[:upper:]' '[:lower:]')"
            is_diagnostic=0
            case "$normalized" in
              *live*|*connectivity*|*availability*|*external_real*) is_diagnostic=1 ;;
            esac

            echo "===== $nodeid =====" | tee -a pytest_online_provider_report.txt
            set +e
            timeout --signal=TERM --kill-after=10s 90s \
              python -m pytest -p no:cacheprovider -q "$nodeid" \
              >> pytest_online_provider_report.txt 2>&1
            rc=$?
            set -e

            if [ "$rc" -eq 0 ]; then
              echo "PASS: $nodeid" | tee -a pytest_online_provider_report.txt
            elif [ "$is_diagnostic" -eq 1 ] || [ "$rc" -eq 124 ] || [ "$rc" -eq 137 ] || [ "$rc" -eq 143 ]; then
              diagnostic_events=$((diagnostic_events + 1))
              echo "DIAGNOSTIC_ONLY rc=$rc: $nodeid" | tee -a pytest_live_provider_diagnostics.txt
              echo "Provider availability or timeout did not block contract validation." | tee -a pytest_live_provider_diagnostics.txt
            else
              contract_failures=$((contract_failures + 1))
              echo "CONTRACT_FAILURE rc=$rc: $nodeid" | tee -a pytest_online_provider_report.txt
            fi
          done

          {
            echo "## Online provider validation"
            echo
            echo "Contract failures: $contract_failures"
            echo "Live-provider diagnostic events: $diagnostic_events"
          } >> "$GITHUB_STEP_SUMMARY"

          test "$contract_failures" -eq 0
      - name: Upload provider reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: online-provider-reports
          path: |
            pytest_online_provider_report.txt
            pytest_live_provider_diagnostics.txt
          if-no-files-found: error

  organism-regressions:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install development dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt
      - name: Run optional organism regressions
        id: organism_tests
        shell: bash
        continue-on-error: true
        run: |
          set -o pipefail
          python -m pytest -p no:cacheprovider -m "organism_regression" -q \
            2>&1 | tee pytest_organism_regression_report.txt
          echo "exit_code=${PIPESTATUS[0]}" >> "$GITHUB_OUTPUT"
      - name: Summarize organism-regression status
        if: always()
        shell: bash
        run: |
          {
            echo "## Optional organism regressions"
            echo
            if [ "${{ steps.organism_tests.outputs.exit_code }}" = "0" ]; then
              echo "All organism-specific regressions matched their historical references."
            else
              echo "One or more organism-specific historical regressions did not match."
              echo "This is diagnostic only and does not affect organism-agnostic validation."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload organism-regression report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: organism-regression-pytest-report
          path: pytest_organism_regression_report.txt
          if-no-files-found: error
