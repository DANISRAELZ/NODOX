name: Public release audit

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install development dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Scan current tree and Git history
        shell: bash
        run: |
          python - <<'PY' | tee secret_scan_report.txt
          from __future__ import annotations

          import re
          import subprocess
          import sys
          from pathlib import Path

          high_confidence = {
              "AWS access key": re.compile(r"\bAKIA[0-9A-Z]{16}\b"),
              "GitHub classic token": re.compile(r"\bgh[pousr]_[A-Za-z0-9]{30,}\b"),
              "GitHub fine-grained token": re.compile(r"\bgithub_pat_[A-Za-z0-9_]{40,}\b"),
              "OpenAI-style key": re.compile(r"\bsk-[A-Za-z0-9_-]{20,}\b"),
              "Slack token": re.compile(r"\bxox[baprs]-[A-Za-z0-9-]{20,}\b"),
              "Private key header": re.compile(r"-----BEGIN (?:RSA |EC |OPENSSH )?PRIVATE KEY-----"),
          }

          warnings = {
              "Windows user path": re.compile(r"[A-Za-z]:\\\\Users\\\\[^\\\s]+"),
              "Likely hard-coded credential": re.compile(
                  r"(?i)\b(?:password|passwd|api[_-]?key|access[_-]?token|secret)\b\s*[:=]\s*['\"][^'\"\n]{8,}['\"]"
              ),
          }

          def decode(data: bytes) -> str | None:
              if b"\x00" in data:
                  return None
              try:
                  return data.decode("utf-8")
              except UnicodeDecodeError:
                  return None

          findings: list[str] = []
          warning_findings: list[str] = []

          tracked = subprocess.check_output(["git", "ls-files", "-z"]).split(b"\0")
          for raw_path in tracked:
              if not raw_path:
                  continue
              path = raw_path.decode("utf-8", errors="replace")
              text = decode(Path(path).read_bytes())
              if text is None:
                  continue
              for name, pattern in high_confidence.items():
                  if pattern.search(text):
                      findings.append(f"current:{path}: {name}")
              for name, pattern in warnings.items():
                  if pattern.search(text):
                      warning_findings.append(f"current:{path}: {name}")

          objects = subprocess.check_output(["git", "rev-list", "--objects", "--all"], text=True).splitlines()
          seen: set[str] = set()
          for line in objects:
              parts = line.split(" ", 1)
              sha = parts[0]
              path = parts[1] if len(parts) == 2 else "<unknown>"
              if sha in seen:
                  continue
              seen.add(sha)
              try:
                  kind = subprocess.check_output(["git", "cat-file", "-t", sha], text=True, stderr=subprocess.DEVNULL).strip()
              except subprocess.CalledProcessError:
                  continue
              if kind != "blob":
                  continue
              size = int(subprocess.check_output(["git", "cat-file", "-s", sha], text=True))
              if size > 5_000_000:
                  continue
              text = decode(subprocess.check_output(["git", "cat-file", "blob", sha]))
              if text is None:
                  continue
              for name, pattern in high_confidence.items():
                  if pattern.search(text):
                      findings.append(f"history:{sha}:{path}: {name}")
              for name, pattern in warnings.items():
                  if pattern.search(text):
                      warning_findings.append(f"history:{sha}:{path}: {name}")

          print("=== High-confidence secret findings ===")
          if findings:
              for item in sorted(set(findings)):
                  print(item)
          else:
              print("None detected")

          print("=== Review warnings ===")
          unique_warnings = sorted(set(warning_findings))
          if unique_warnings:
              for item in unique_warnings[:500]:
                  print(item)
              if len(unique_warnings) > 500:
                  print("Additional warnings omitted")
          else:
              print("None detected")

          if findings:
              sys.exit(1)
          PY

      - name: Run portable offline test suite
        id: portable_tests
        shell: bash
        continue-on-error: true
        run: |
          set -o pipefail
          python -m pytest -p no:cacheprovider -m "not online" -q \
            --deselect tests/test_e2e.py::EndToEndTests::test_full_phase2_pipeline_runs_on_example_data \
            --deselect tests/test_ranking_snapshots.py::test_pao1_demo_pipeline_matches_curated_snapshot \
            --deselect tests/test_scoring.py::ScoringTests::test_scores_are_generated_in_expected_range \
            --deselect tests/test_scoring.py::ScoringTests::test_specific_therapeutic_rules_take_priority_over_mixed_fallback \
            2>&1 | tee pytest_offline_report.txt
          echo "exit_code=${PIPESTATUS[0]}" >> "$GITHUB_OUTPUT"

      - name: Run historical PAO1 regression checks
        id: historical_tests
        shell: bash
        continue-on-error: true
        run: |
          set -o pipefail
          python -m pytest -p no:cacheprovider -q \
            tests/test_e2e.py::EndToEndTests::test_full_phase2_pipeline_runs_on_example_data \
            tests/test_ranking_snapshots.py::test_pao1_demo_pipeline_matches_curated_snapshot \
            tests/test_scoring.py::ScoringTests::test_scores_are_generated_in_expected_range \
            tests/test_scoring.py::ScoringTests::test_specific_therapeutic_rules_take_priority_over_mixed_fallback \
            2>&1 | tee pytest_historical_regression_report.txt
          echo "exit_code=${PIPESTATUS[0]}" >> "$GITHUB_OUTPUT"

      - name: Summarize historical regression status
        if: always()
        shell: bash
        run: |
          {
            echo "## Historical PAO1 regression checks"
            echo
            if [ "${{ steps.historical_tests.outputs.exit_code }}" = "0" ]; then
              echo "Historical regression checks passed."
            else
              echo "Historical regression checks did not match the former local PAO1 fixture."
              echo "They remain visible as a non-blocking diagnostic until a reviewed public reference snapshot is established."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload audit reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: public-release-audit-reports
          path: |
            secret_scan_report.txt
            pytest_offline_report.txt
            pytest_historical_regression_report.txt
          if-no-files-found: warn

      - name: Enforce portable test result
        if: always()
        shell: bash
        run: |
          test "${{ steps.portable_tests.outputs.exit_code }}" = "0"

  full-suite:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install development dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Run complete pytest suite
        id: complete_tests
        shell: bash
        continue-on-error: true
        run: |
          set -o pipefail
          python -m pytest -p no:cacheprovider -q 2>&1 | tee pytest_complete_report.txt
          echo "exit_code=${PIPESTATUS[0]}" >> "$GITHUB_OUTPUT"

      - name: Upload complete-suite report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: complete-pytest-suite-report
          path: pytest_complete_report.txt
          if-no-files-found: error

      - name: Enforce complete-suite result
        if: always()
        shell: bash
        run: |
          test "${{ steps.complete_tests.outputs.exit_code }}" = "0"
