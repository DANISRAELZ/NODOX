name: Public release inventory

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inventory-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Audit tracked files and text history
        shell: bash
        run: |
          python - <<'PY' | tee public_release_inventory_report.txt
          from __future__ import annotations

          import fnmatch
          import re
          import subprocess
          import sys
          from pathlib import Path

          blocked_file_patterns = [
              ".env",
              ".env.*",
              "*.pem",
              "*.key",
              "*.p12",
              "*.pfx",
              "id_rsa",
              "id_ed25519",
              "credentials.json",
              "credentials*.json",
              ".netrc",
              "cookies.txt",
              "*.dmnd",
          ]

          generic_usernames = {
              "user",
              "username",
              "example",
              "example_user",
              "test",
              "test_user",
              "testuser",
              "x",
              "runner",
              "runneradmin",
              "admin",
              "public",
              "default",
              "someone",
              "yourname",
              "your_name",
              "<user>",
              "<username>",
          }

          path_patterns = [
              ("Windows user path", re.compile(r"[A-Za-z]:[\\/]+Users[\\/]+(?P<username>[^\\/\s]+)", re.IGNORECASE)),
              ("Linux home path", re.compile(r"/(?:home|Users)/(?P<username>[^/\s]+)/")),
              ("WSL mounted user path", re.compile(r"/mnt/[a-zA-Z]/Users/(?P<username>[^/\s]+)/", re.IGNORECASE)),
          ]
          url_pattern = re.compile(r"https?://\S+", re.IGNORECASE)
          self_path = ".github/workflows/public-release-inventory.yml"

          def decode(data: bytes) -> str | None:
              if b"\x00" in data:
                  return None
              try:
                  return data.decode("utf-8")
              except UnicodeDecodeError:
                  return None

          def personal_path_findings(text: str) -> list[tuple[str, str]]:
              findings: list[tuple[str, str]] = []
              for raw_line in text.splitlines():
                  line = url_pattern.sub("", raw_line)
                  for label, pattern in path_patterns:
                      for match in pattern.finditer(line):
                          username = match.group("username").strip("`'\"()[]{}<>,;:").lower()
                          if username in generic_usernames or username.startswith("$") or username.startswith("{"):
                              continue
                          findings.append((label, username))
              return findings

          tracked = [
              item.decode("utf-8", errors="replace")
              for item in subprocess.check_output(["git", "ls-files", "-z"]).split(b"\0")
              if item
          ]

          blocked_files: list[str] = []
          for path in tracked:
              name = Path(path).name
              for pattern in blocked_file_patterns:
                  if fnmatch.fnmatch(path, pattern) or fnmatch.fnmatch(name, pattern):
                      blocked_files.append(f"{path} matches {pattern}")

          current_paths: list[str] = []
          for path in tracked:
              if path == self_path:
                  continue
              file_path = Path(path)
              if not file_path.is_file() or file_path.stat().st_size > 5_000_000:
                  continue
              text = decode(file_path.read_bytes())
              if text is None:
                  continue
              for label, username in personal_path_findings(text):
                  current_paths.append(f"{path}: {label}; username={username}")

          history_paths: list[str] = []
          seen: set[str] = set()
          for line in subprocess.check_output(["git", "rev-list", "--objects", "--all"], text=True).splitlines():
              parts = line.split(" ", 1)
              sha = parts[0]
              path = parts[1] if len(parts) == 2 else "<unknown>"
              if sha in seen:
                  continue
              seen.add(sha)
              try:
                  if subprocess.check_output(["git", "cat-file", "-t", sha], text=True, stderr=subprocess.DEVNULL).strip() != "blob":
                      continue
                  if int(subprocess.check_output(["git", "cat-file", "-s", sha], text=True)) > 5_000_000:
                      continue
                  text = decode(subprocess.check_output(["git", "cat-file", "blob", sha]))
              except subprocess.CalledProcessError:
                  continue
              if text is None:
                  continue
              for label, username in personal_path_findings(text):
                  history_paths.append(f"{sha}:{path}: {label}; username={username}")

          print("=== Blocked tracked files ===")
          print("\n".join(sorted(set(blocked_files))) if blocked_files else "None detected")
          print("\n=== Likely personal absolute paths in current tree ===")
          print("\n".join(sorted(set(current_paths))) if current_paths else "None detected")
          print("\n=== Likely personal absolute path warnings in Git history ===")
          unique_history = sorted(set(history_paths))
          print("\n".join(unique_history[:500]) if unique_history else "None detected")
          if len(unique_history) > 500:
              print(f"Additional history warnings omitted: {len(unique_history) - 500}")

          if blocked_files or current_paths:
              sys.exit(1)
          PY

      - name: Upload inventory report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: public-release-inventory-report
          path: public_release_inventory_report.txt
          if-no-files-found: error
